  <line x1="16" y1="46" x2="384" y2="46" stroke="#2b2b2b"/>

  <text x="16" y="68" fill="#9a9a9a" font-size="11">本会话允许的路由</text>
  <text x="384" y="68" fill="#6f6f6f" font-size="10.5" text-anchor="end">2 条</text>

  <rect x="16" y="78" width="368" height="24" rx="6" fill="#212121" stroke="#2f2f2f"/>
  <text x="26" y="94" fill="#ededed" font-size="12">opencodex/command-code/deepseek-v4.1-flash</text>
  <text x="368" y="94" fill="#6f6f6f" font-size="12" text-anchor="end">×</text>

  <rect x="16" y="106" width="368" height="24" rx="6" fill="#212121" stroke="#2f2f2f"/>
  <text x="26" y="122" fill="#ededed" font-size="12">opencode-go/deepseek-v4.1-flash</text>
  <text x="368" y="122" fill="#6f6f6f" font-size="12" text-anchor="end">×</text>

  <rect x="16" y="134" width="368" height="24" rx="6" fill="none" stroke="#3a3a3a" stroke-dasharray="4 3"/>
  <text x="26" y="150" fill="#7aa2ff" font-size="12">＋ 添加路由</text>
  <text x="368" y="150" fill="#6f6f6f" font-size="10.5" text-anchor="end">部署默认 2 条</text>

  <line x1="16" y1="176" x2="384" y2="176" stroke="#2b2b2b"/>

  <text x="16" y="198" fill="#9a9a9a" font-size="11">子智能体</text>
  <rect x="64" y="186" width="20" height="15" rx="7" fill="#262626"/>
  <text x="74" y="197" fill="#9a9a9a" font-size="10" text-anchor="middle">3</text>
  <text x="384" y="198" fill="#6f6f6f" font-size="11" text-anchor="end">1 运行中</text>

  <rect x="12" y="206" width="376" height="30" rx="7" fill="#232a3a" stroke="#3b4a6b"/>
  <circle cx="24" cy="221" r="3.5" fill="#6cc46c"/>
  <text x="36" y="225" fill="#ededed" font-size="12">分析 team/subagent 接缝</text>
  <text x="330" y="225" fill="#9a9a9a" font-size="10.5" font-family="'SF Mono', Menlo, monospace" text-anchor="end">deepseek-v4.1-flash</text>
  <text x="384" y="225" fill="#6f6f6f" font-size="10.5" text-anchor="end">d1</text>

  <circle cx="24" cy="255" r="3.5" fill="#4a4a4a"/>
  <text x="36" y="259" fill="#ededed" font-size="12">面板与设置页 UI 机制</text>
  <text x="330" y="259" fill="#9a9a9a" font-size="10.5" font-family="'SF Mono', Menlo, monospace" text-anchor="end">gpt-6.1-sol</text>
  <text x="384" y="259" fill="#6f6f6f" font-size="10.5" text-anchor="end">d1</text>

  <circle cx="24" cy="289" r="3.5" fill="#4a4a4a"/>
  <text x="36" y="293" fill="#ededed" font-size="12">隔离 DSH_HOME 验证方案</text>
  <text x="330" y="293" fill="#9a9a9a" font-size="10.5" font-family="'SF Mono', Menlo, monospace" text-anchor="end">继承 · 未知</text>
  <text x="384" y="293" fill="#6f6f6f" font-size="10.5" text-anchor="end">d2</text>

  <line x1="16" y1="318" x2="384" y2="318" stroke="#2b2b2b"/>

  <text x="16" y="340" fill="#9a9a9a" font-size="11">把「分析 team/subagent 接缝」切到</text>
  <rect x="16" y="350" width="286" height="28" rx="7" fill="#212121" stroke="#3a3a3a"/>
  <text x="28" y="368" fill="#9a9a9a" font-size="12">选择路由…</text>
  <path d="M282 361 l5 5 l5 -5" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
  <rect x="310" y="350" width="74" height="28" rx="7" fill="#2b3a5e" stroke="#41598c"/>
  <text x="347" y="368" fill="#ededed" font-size="12" text-anchor="middle">切换</text>

  <text x="16" y="400" fill="#6f6f6f" font-size="10.5">点一行选中它，再「切换」；不选中就改当前会话自己。</text>
  <text x="16" y="416" fill="#6f6f6f" font-size="10.5">可选路由 = 本会话允许列表（未配置时用部署默认）。</text>
