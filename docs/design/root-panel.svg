<svg xmlns="http://www.w3.org/2000/svg" width="400" height="430" viewBox="0 0 400 430" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <rect x="1" y="1" width="398" height="428" rx="12" fill="#1b1b1b" stroke="#333" />
  <text x="16" y="30" fill="#ededed" font-size="13" font-weight="600">子智能体模型</text>
  <rect x="272" y="16" width="112" height="20" rx="10" fill="none" stroke="#3a3a3a"/>
