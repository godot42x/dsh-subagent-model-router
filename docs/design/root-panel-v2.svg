<svg xmlns="http://www.w3.org/2000/svg" width="420" height="470" viewBox="0 0 420 470" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <rect x="1" y="1" width="418" height="468" rx="12" fill="#1b1b1b" stroke="#333"/>
  <text x="16" y="30" fill="#ededed" font-size="13" font-weight="600">子智能体模型</text>

  <!-- mode segmented -->
  <rect x="16" y="44" width="388" height="28" rx="8" fill="#212121" stroke="#2f2f2f"/>
  <rect x="19" y="47" width="126" height="22" rx="6" fill="#2b3a5e" stroke="#41598c"/>
  <text x="82" y="62" fill="#ededed" font-size="11.5" text-anchor="middle">本会话白名单</text>
  <text x="211" y="62" fill="#9a9a9a" font-size="11.5" text-anchor="middle">跟随部署默认</text>
  <text x="340" y="62" fill="#9a9a9a" font-size="11.5" text-anchor="middle">不限制</text>
  <text x="16" y="88" fill="#6f6f6f" font-size="10.5">白名单内的路由才允许子激活；不在列表里的会被拒绝。</text>

  <!-- allowlist -->
  <text x="16" y="112" fill="#9a9a9a" font-size="11">本会话允许的路由</text>
  <text x="404" y="112" fill="#6f6f6f" font-size="10.5" text-anchor="end">2 条</text>
  <rect x="16" y="120" width="388" height="24" rx="6" fill="#212121" stroke="#2f2f2f"/>
  <text x="26" y="136" fill="#ededed" font-size="12">opencodex/command-code/deepseek-v4.1-flash</text>
  <text x="392" y="136" fill="#6f6f6f" font-size="12" text-anchor="end">×</text>
  <rect x="16" y="148" width="388" height="24" rx="6" fill="#212121" stroke="#2f2f2f"/>
  <text x="26" y="164" fill="#ededed" font-size="12">opencode-go/deepseek-v4.1-flash</text>
  <text x="392" y="164" fill="#6f6f6f" font-size="12" text-anchor="end">×</text>
  <rect x="16" y="176" width="388" height="24" rx="6" fill="none" stroke="#3a3a3a" stroke-dasharray="4 3"/>
  <text x="26" y="192" fill="#7aa2ff" font-size="12">＋ 添加路由</text>
  <text x="392" y="192" fill="#6f6f6f" font-size="10.5" text-anchor="end">部署默认 2 条</text>

  <line x1="16" y1="214" x2="404" y2="214" stroke="#2b2b2b"/>

  <!-- children -->
  <text x="16" y="236" fill="#9a9a9a" font-size="11">子智能体</text>
  <rect x="64" y="224" width="20" height="15" rx="7" fill="#262626"/>
  <text x="74" y="235" fill="#9a9a9a" font-size="10" text-anchor="middle">3</text>
  <text x="404" y="236" fill="#6f6f6f" font-size="10.5" text-anchor="end">1 运行中</text>

  <!-- row 1: inherited -->
  <circle cx="24" cy="258" r="3.5" fill="#4a4a4a"/>
  <text x="36" y="262" fill="#ededed" font-size="12">分析 team/subagent 接缝</text>
  <rect x="196" y="248" width="60" height="16" rx="8" fill="none" stroke="#4a3f2a"/>
  <text x="226" y="259" fill="#e5b567" font-size="9.5" text-anchor="middle">继承</text>
  <text x="360" y="262" fill="#9a9a9a" font-size="10" font-family="'SF Mono', Menlo, monospace" text-anchor="end">v4.1-flash</text>
  <rect x="368" y="247" width="24" height="18" rx="5" fill="none" stroke="#3a3a3a"/>
  <text x="380" y="260" fill="#9a9a9a" font-size="11" text-anchor="middle">⇄</text>

  <!-- row 2: pending, expanded -->
  <rect x="12" y="274" width="396" height="26" rx="6" fill="#212a3a"/>
  <circle cx="24" cy="287" r="3.5" fill="#6cc46c"/>
  <text x="36" y="291" fill="#ededed" font-size="12">面板与设置页 UI 机制</text>
  <rect x="188" y="279" width="76" height="16" rx="8" fill="#2a2418" stroke="#4a3f2a"/>
  <text x="226" y="290" fill="#e5b567" font-size="9.5" text-anchor="middle">待生效 →</text>
  <text x="360" y="291" fill="#9a9a9a" font-size="10" font-family="'SF Mono', Menlo, monospace" text-anchor="end">gpt-6.1-sol</text>
  <rect x="368" y="277" width="24" height="18" rx="5" fill="#2b3a5e" stroke="#41598c"/>
  <text x="380" y="290" fill="#ededed" font-size="11" text-anchor="middle">⇄</text>

  <!-- inline switch for row 2 -->
  <rect x="24" y="304" width="372" height="30" rx="7" fill="#171717" stroke="#3a3a3a"/>
  <text x="36" y="323" fill="#9a9a9a" font-size="11.5">切到</text>
  <text x="70" y="323" fill="#7aa2ff" font-size="11.5">opencode-go/deepseek-v4.1-flash</text>
  <path d="M300 314 l4 4 l4 -4" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <rect x="322" y="308" width="66" height="22" rx="5" fill="#2b3a5e" stroke="#41598c"/>
  <text x="355" y="323" fill="#ededed" font-size="11" text-anchor="middle">确认</text>
  <text x="24" y="350" fill="#6f6f6f" font-size="10">只改这一行；它下面没有继承路由的子智能体。</text>

  <!-- row 3: unknown, depth 2 -->
  <circle cx="24" cy="374" r="3.5" fill="#4a4a4a"/>
  <text x="36" y="378" fill="#ededed" font-size="12">隔离 DSH_HOME 验证方案</text>
  <rect x="196" y="366" width="60" height="16" rx="8" fill="none" stroke="#3a3a3a"/>
  <text x="226" y="377" fill="#8f8f8f" font-size="9.5" text-anchor="middle">d2 · 只读</text>
  <text x="360" y="378" fill="#9a9a9a" font-size="10" font-family="'SF Mono', Menlo, monospace" text-anchor="end">未知</text>
  <rect x="368" y="365" width="24" height="18" rx="5" fill="none" stroke="#2f2f2f"/>
  <text x="380" y="378" fill="#4a4a4a" font-size="11" text-anchor="middle">⇄</text>

  <line x1="16" y1="398" x2="404" y2="398" stroke="#2b2b2b"/>
  <text x="16" y="420" fill="#6f6f6f" font-size="10.5">⇄ = 只改这一行；主会话自己不在这里切（用顶部模型选择器）。</text>
  <text x="16" y="436" fill="#6f6f6f" font-size="10.5">d2 及更深的行只读：要改请进它自己的会话。</text>
  <text x="16" y="456" fill="#6f6f6f" font-size="10.5">（出错时这里出现一行红字，例如：该会话正被写入，稍后重试）</text>
</svg>
