<svg xmlns="http://www.w3.org/2000/svg" width="420" height="452" viewBox="0 0 420 452" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
  <rect x="1" y="1" width="418" height="450" rx="12" fill="#1b1b1b" stroke="#333"/>
  <text x="16" y="30" fill="#ededed" font-size="13" font-weight="600">子智能体模型</text>

  <!-- allow-set status line -->
  <text x="16" y="58" fill="#9a9a9a" font-size="11">允许集合</text>
  <text x="76" y="58" fill="#ededed" font-size="12">本会话白名单 · 2 条</text>
  <rect x="318" y="42" width="86" height="22" rx="6" fill="none" stroke="#3a3a3a"/>
  <text x="361" y="57" fill="#ededed" font-size="11.5" text-anchor="middle">完成</text>

  <!-- editing list -->
  <rect x="16" y="72" width="388" height="24" rx="6" fill="#212121" stroke="#2f2f2f"/>
  <text x="26" y="88" fill="#ededed" font-size="11.5">opencodex/command-code/deepseek-v4.1-flash</text>
  <text x="392" y="88" fill="#6f6f6f" font-size="12" text-anchor="end">×</text>
  <rect x="16" y="100" width="388" height="24" rx="6" fill="#212121" stroke="#2f2f2f"/>
  <text x="26" y="116" fill="#ededed" font-size="11.5">opencode-go/deepseek-v4.1-flash</text>
  <text x="392" y="116" fill="#6f6f6f" font-size="12" text-anchor="end">×</text>
  <rect x="16" y="128" width="250" height="24" rx="6" fill="#212121" stroke="#2f2f2f"/>
  <text x="26" y="144" fill="#9a9a9a" font-size="11.5">provider ▾</text>
  <rect x="272" y="128" width="132" height="24" rx="6" fill="#212121" stroke="#2f2f2f"/>
  <text x="282" y="144" fill="#9a9a9a" font-size="11.5">model ▾</text>
  <rect x="16" y="156" width="70" height="22" rx="6" fill="none" stroke="#3a3a3a"/>
  <text x="51" y="171" fill="#ededed" font-size="11" text-anchor="middle">添加</text>
  <text x="404" y="171" fill="#6f6f6f" font-size="10" text-anchor="end">部署默认 2 条</text>

  <line x1="16" y1="190" x2="404" y2="190" stroke="#2b2b2b"/>

  <!-- children -->
  <text x="16" y="212" fill="#9a9a9a" font-size="11">子智能体</text>
  <text x="404" y="212" fill="#9a9a9a" font-size="11" text-anchor="end">2 个 · 1 运行中 · 另有 1 个深层</text>

  <!-- row 1 -->
  <circle cx="24" cy="234" r="3.5" fill="#4a4a4a"/>
  <text x="36" y="238" fill="#ededed" font-size="12">分析 team/subagent 接缝</text>
  <rect x="196" y="226" width="44" height="16" rx="8" fill="none" stroke="#4a3f2a"/>
  <text x="218" y="237" fill="#e5b567" font-size="9.5" text-anchor="middle">继承</text>
  <text x="360" y="238" fill="#9a9a9a" font-size="10" font-family="'SF Mono', Menlo, monospace" text-anchor="end">v4.1-flash</text>
  <rect x="368" y="224" width="24" height="18" rx="5" fill="none" stroke="#3a3a3a"/>
  <text x="380" y="237" fill="#9a9a9a" font-size="11" text-anchor="middle">⇄</text>

  <!-- row 2 expanded -->
  <rect x="12" y="250" width="396" height="26" rx="6" fill="#212a3a"/>
  <circle cx="24" cy="263" r="3.5" fill="#6cc46c"/>
  <text x="36" y="267" fill="#ededed" font-size="12">面板与设置页 UI 机制</text>
  <rect x="180" y="255" width="76" height="16" rx="8" fill="#2a2418" stroke="#4a3f2a"/>
  <text x="218" y="266" fill="#e5b567" font-size="9.5" text-anchor="middle">待生效 →</text>
  <text x="360" y="267" fill="#9a9a9a" font-size="10" font-family="'SF Mono', Menlo, monospace" text-anchor="end">gpt-6.1-sol</text>
  <rect x="368" y="253" width="24" height="18" rx="5" fill="#2b3a5e" stroke="#41598c"/>
  <text x="380" y="266" fill="#ededed" font-size="11" text-anchor="middle">⇄</text>

  <rect x="24" y="280" width="372" height="30" rx="7" fill="#171717" stroke="#3a3a3a"/>
  <text x="36" y="299" fill="#9a9a9a" font-size="11.5">切到</text>
  <text x="70" y="299" fill="#7aa2ff" font-size="11.5">opencode-go/deepseek-v4.1-flash</text>
  <path d="M300 290 l4 4 l4 -4" fill="none" stroke="#8a8a8a" stroke-width="1.3"/>
  <rect x="316" y="284" width="40" height="22" rx="5" fill="#2b3a5e" stroke="#41598c"/>
  <text x="336" y="299" fill="#ededed" font-size="10.5" text-anchor="middle">确认</text>
  <rect x="360" y="284" width="30" height="22" rx="5" fill="none" stroke="#3a3a3a"/>
  <text x="375" y="299" fill="#9a9a9a" font-size="10.5" text-anchor="middle">取消</text>
  <text x="24" y="326" fill="#6f6f6f" font-size="10">它下面还有 1 个子智能体继承这条路由，会一起变。</text>

  <line x1="16" y1="342" x2="404" y2="342" stroke="#2b2b2b"/>
  <text x="16" y="364" fill="#6f6f6f" font-size="10.5">⇄ 只改这一行；你自己切换模型请用顶部的模型选择器。</text>
  <text x="16" y="382" fill="#6f6f6f" font-size="10.5">这里只列直接子智能体；更深的在各自会话里切换。</text>
  <text x="16" y="400" fill="#6f6f6f" font-size="10.5">列表改小不会打断已在跑的子智能体，只影响下一次派发。</text>
  <text x="16" y="424" fill="#e08a8a" font-size="10.5">（出错时才出现一行，例如：该会话正被写入，稍后重试）</text>
  <text x="16" y="442" fill="#6f6f6f" font-size="9.5">?dev=1 才显示层级与 session id</text>
</svg>
